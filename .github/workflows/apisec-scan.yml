name: APIsec Surface org scan

# This is the whole install. The scan logic lives in APIsec's public repository
# and is fetched at run time at the v1 tag, so fixes reach you without editing
# this file. Secrets and variables are read from this organization.
#
# Secrets:   APISEC_TOKEN (required), ORG_READ_TOKEN (recommended)
# Variables: APISEC_ENDPOINT (required); optional: APISEC_RUN_PROFILE,
#            APISEC_LLM_ENRICHMENT, THROUGHPUT, ORCHESTRATOR_RUNNER,
#            TARGET_ORG, EXCLUDE_REPOS, APISEC_CLI_VERSION

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Analyze but do not upload'
        type: boolean
        default: false
      force_full_scan:
        description: 'Ignore the change cache and scan every repo'
        type: boolean
        default: false
      max_repos:
        description: 'Cap repos per run (0 = no cap)'
        type: string
        default: '0'
      throughput:
        description: 'Max parallel scans (0 = org variable, else 2)'
        type: string
        default: '0'
      runner:
        description: 'github-hosted | self-hosted (blank = org variable, else github-hosted)'
        type: string
        default: ''
      run_profile:
        description: 'surface | legacy (blank = org variable, else surface)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  scan:
    uses: apisec-inc/poc-apisec-orchestrator/.github/workflows/scan.yml@v1
    with:
      dry_run:         ${{ inputs.dry_run || false }}
      force_full_scan: ${{ inputs.force_full_scan || false }}
      max_repos:       ${{ inputs.max_repos || '0' }}
      throughput:      ${{ inputs.throughput || '0' }}
      runner:          ${{ inputs.runner || '' }}
      run_profile:     ${{ inputs.run_profile || '' }}
    secrets: inherit
