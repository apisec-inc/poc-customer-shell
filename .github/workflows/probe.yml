name: probe
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Analyze but do not upload'
        type: boolean
        default: false
      max_repos:
        description: 'Cap repos per run (0 = no cap)'
        type: number
        default: 0
jobs:
  scan:
    uses: apisec-inc/poc-apisec-orchestrator/.github/workflows/scan.yml@v1
    with:
      dry_run: ${{ inputs.dry_run }}
      max_repos: ${{ inputs.max_repos }}
    secrets: inherit
